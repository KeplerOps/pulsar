# SonarCloud Configuration
# https://sonarcloud.io/project/overview?id=KeplerOps_pulsar

sonar.projectKey=KeplerOps_pulsar
sonar.organization=keplerops

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.min.js,\
  assets/**

# Coverage exclusions: workbench entry and Vite/Vitest configs are not
# part of the runtime surface measured by tests.
sonar.coverage.exclusions=\
  **/main.ts,\
  **/*.config.ts

# TypeScript coverage report
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
