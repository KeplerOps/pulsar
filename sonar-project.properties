# SonarCloud Configuration
# https://sonarcloud.io/project/overview?id=KeplerOps_pulsar

sonar.projectKey=KeplerOps_pulsar
sonar.organization=keplerops

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.min.js,\
  assets/**

# Coverage exclusions: the workbench entry, Vite/Vitest configs, and the
# example decks are not part of the product surface the coverage gate
# measures. Pulsar's product is the runtime + reusable template library
# ("the runtime is the product, not a specific deck"); the decks are
# demonstration content, exercised end-to-end by the Playwright specs
# (tests-e2e/pulsar-intro.spec.ts, aces-ecosystem-navigation.spec.ts).
sonar.coverage.exclusions=\
  **/main.ts,\
  **/*.config.ts,\
  src/decks/**

# Duplication exclusions: the example decks are demonstration content
# whose scenes share an intentionally-repetitive build/beats scaffold
# (a deck is many similar scenes by design). That is not product
# duplication — the same "the runtime is the product, not a specific
# deck" rationale as the coverage exclusion above. The product surface
# (runtime + template library) carries negligible duplication.
sonar.cpd.exclusions=\
  src/decks/**

# TypeScript coverage report
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
