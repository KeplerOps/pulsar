fail_fast: true

repos:
  # =============================================================================
  # STAGE 1: Fast checks (linting, formatting, syntax)
  # =============================================================================

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # GitHub Actions workflow lint
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$

  # =============================================================================
  # STAGE 2: Security
  # =============================================================================

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # =============================================================================
  # STAGE 3: TypeScript checks (mirror CI). Local hooks; require pnpm in PATH.
  # =============================================================================

  - repo: local
    hooks:
      - id: biome-check
        name: biome check (lint + format, write fixes)
        entry: bash -c 'pnpm exec biome check --write "$@"' --
        language: system
        types_or: [ts, tsx, javascript, json]
        exclude: ^(pnpm-lock\.yaml)$

      - id: typecheck
        name: tsc --noEmit
        entry: bash -c 'pnpm typecheck'
        language: system
        pass_filenames: false
        files: ^(src/.*\.ts|tests/.*\.ts|tsconfig.*\.json|package\.json|vite\.config\.ts|vitest\.config\.ts)$

      - id: vitest
        name: vitest run
        entry: bash -c 'pnpm test'
        language: system
        pass_filenames: false
        files: ^(src/.*\.ts|tests/.*\.ts|vitest\.config\.ts|package\.json)$

      # Structural code-shape audits, relocated out of the behavior
      # suite into their own vitest project (vitest.policy.config.ts).
      # Blocking — same enforcement set as before, just no longer mixed
      # into `pnpm test`. Mirrored by the CI `policy` job.
      - id: policy
        name: pnpm policy (source-policy gate)
        entry: bash -c 'pnpm policy'
        language: system
        pass_filenames: false
        files: ^(src/.*\.ts|tests/.*\.ts|biome\.json|vitest\.policy\.config\.ts|package\.json)$
